<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joey Stanford</title>
<meta name="description" content="Joey Stanford — affable open source, ham radio, data privacy, and security geek. Colorado, USA.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0a0b0f">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/favicon.png">
<style>
:root{
  --bg:#0a0b0f; --fg:#e9eaf0; --muted:#8b8fa3;
  --a1:#7c8cff; --a2:#36e0c8;
  --card:rgba(255,255,255,.04); --border:rgba(255,255,255,.09);
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f7f8fb; --fg:#14151b; --muted:#5a5f70;
    --card:rgba(20,21,27,.03); --border:rgba(20,21,27,.09); }
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100dvh; display:grid; place-items:center; padding:24px;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--fg); -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 560px at 50% -12%, color-mix(in srgb,var(--a1) 20%,transparent), transparent 60%),
    radial-gradient(900px 520px at 88% 112%, color-mix(in srgb,var(--a2) 15%,transparent), transparent 60%),
    var(--bg);
}
.card{
  width:min(560px,100%); text-align:center; padding:42px 30px;
  border:1px solid var(--border); border-radius:22px; background:var(--card);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  animation:rise .7s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.avatar{
  width:120px;height:120px;border-radius:50%;margin:0 auto 18px;
  object-fit:cover;object-position:50% 22%;
  border:1px solid var(--border);
  background:var(--card);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--a1) 14%,transparent),0 8px 24px rgba(0,0,0,.25);
}
h1{font-size:clamp(1.6rem,5vw,2.1rem);font-weight:700;letter-spacing:-.02em}
.role{color:var(--muted);margin-top:6px;font-size:.95rem}
.bio{margin:18px auto 0;max-width:44ch;line-height:1.6;opacity:.92}
.tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:22px}
.tag{font-size:.78rem;padding:5px 11px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:26px}
.links a{
  display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;
  border:1px solid var(--border);color:var(--fg);text-decoration:none;font-size:.92rem;
  transition:transform .15s ease,border-color .15s ease,background .15s ease;
}
.links a:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--a1) 55%,var(--border));background:color-mix(in srgb,var(--a1) 9%,transparent)}
.links svg{width:18px;height:18px;fill:currentColor}
footer{margin-top:28px;font-size:.78rem;color:var(--muted)}
footer a{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
@media (prefers-reduced-motion: reduce){.card{animation:none}.links a:hover{transform:none}}
</style>
</head>
<body>
<main class="card">
  <img class="avatar" src="assets/joey.jpg" alt="Joey Stanford" width="120" height="120">
  <h1>Joey Stanford</h1>
  <p class="role">Open Source · Ham Radio · Data Privacy · Security</p>
  <p class="bio">Affable open source, ham radio, data privacy, and security geek based in Colorado, USA — building decentralized tools and community infrastructure.</p>

  </nav>
  <footer>© 2026 Joey Stanford · Content licensed <a href="https://creativecommons.org/licenses/by/4.0/" rel="license">CC BY 4.0</a></footer>
</main>
</body>
</html>
